<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!-- ============ Core ============ -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://www.parkingexpert.com/" />

  <!-- ============ SEO ============ -->
  <title>Parking Expert | Smart Parking Management SaaS</title>

  <meta name="description"
    content="Parking Expert is a smart SaaS platform for parking operators — manage vehicles, spaces, users and real-time occupancy in one dashboard. Automate operations, cut costs and gain live analytics." />

  <meta name="keywords"
    content="parking management software, smart parking SaaS, parking automation, vehicle management system, parking analytics, parking operations platform" />

  <meta name="author" content="Parking Expert" />
  <meta name="application-name" content="Parking Expert" />

  <!-- ============ Open Graph (used by WhatsApp, Facebook, LinkedIn, iMessage) ============ -->
  <meta property="og:site_name" content="Parking Expert" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="https://www.parkingexpert.com/" />
  <meta property="og:title" content="Parking Expert — Smart Parking Management SaaS" />
  <meta property="og:description"
    content="Automate parking operations with real-time analytics, vehicle tracking and space management — built for modern parking operators." />
  <meta property="og:image" content="https://www.parkingexpert.com/assets/og/parking-expert-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Parking Expert dashboard preview" />

  <!-- ============ Twitter / X Card ============ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@parkingexpert" />
  <meta name="twitter:creator" content="@parkingexpert" />
  <meta name="twitter:title" content="Parking Expert — Smart Parking Management SaaS" />
  <meta name="twitter:description"
    content="Automate parking operations with real-time analytics, vehicle tracking and space management." />
  <meta name="twitter:image" content="https://www.parkingexpert.com/assets/og/parking-expert-cover.png" />

  <!-- ============ Favicons (from /assets/favicon) ============ -->
 <!-- ============ Favicon ============ -->
<link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
<link rel="shortcut icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
<link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
  <link rel="mask-icon" href="%PUBLIC_URL%/assets/favicon/safari-pinned-tab.svg" color="#0B1220" />

  <!-- ============ Mobile / PWA ============ -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Parking Expert" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- ============ Fonts ============ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <!-- ============ Structured Data (rich results) ============ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Parking Expert",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Smart SaaS platform for managing parking vehicles, spaces, users and real-time operations.",
    "url": "https://www.parkingexpert.com/",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "USD",
      "price": "0"
    }
  }
  </script>
</head>

<body>

  <!-- Initial SaaS Loader -->
  <div id="startup-loader">
    <div class="loader-spinner"></div>
  </div>
  <noscript>
    Enable JavaScript to use Parking Expert.
  </noscript>

  <div id="root"></div>

</body>

</html>
